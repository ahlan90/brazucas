<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brazucas · Guilda Eternal Hero</title>
<meta name="description" content="Pódio, campeões da semana, ranking e evolução dos membros da guilda Brazucas no Eternal Hero.">
<meta property="og:title" content="Brazucas · Guilda Eternal Hero">
<meta property="og:description" content="Pódio, campeões e ranking semanal da guilda Brazucas.">
<meta property="og:image" content="assets/game/keyart.webp">
<link rel="icon" href="assets/game/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/arena.css">
<link rel="stylesheet" href="assets/css/guilda.css">
<script src="assets/js/auth.js"></script>
<script>BZAUTH.require();</script>
</head>
<body>
<header class="hero">
  <div class="wrap hero-in">
    <div class="brand"><h1 id="logoSlot">Brazucas</h1><p id="bz-weeklabel">Carregando…</p></div>
    <div class="hero-side"><img class="eh" src="assets/game/eh-logo.webp" alt="Eternal Hero"><label class="bz-sr" for="bz-week">Semana</label><select class="week" id="bz-week"></select></div>
  </div>
</header>
<div class="wrap">
  <section class="guild-strip" id="guildStrip" aria-label="Números da guilda"></section>
  <nav class="tabs" aria-label="Seções">
    <a class="gbtn" href="#hall" data-view="hall">Home</a>
    <a class="gbtn" href="#ranking" data-view="ranking">Ranking</a>
    <a class="gbtn" href="#perfil" data-view="perfil">Perfil</a>
    <a class="gbtn" href="#guilda" data-view="guilda">Guilda</a>
    <span class="nav-right"><a class="admin-link" href="admin.html" id="adminLink" hidden></a><span class="admin-link user-name" id="userName"></span><a class="admin-link" href="#" id="logoutLink">Sair</a></span>
  </nav>
  <main>
    <section id="view-hall"><div id="hall"></div></section>
    <section id="view-ranking" hidden><h2 class="sec">Ranking da guilda <small>clique no cabeçalho para ordenar · filtre em qualquer coluna (ex.: &gt;300, 100-200)</small></h2><div id="ranking"></div></section>
    <section id="view-perfil" hidden><h2 class="sec">Perfil do herói</h2><div id="perfil"></div></section>
    <section id="view-guilda" hidden><h2 class="sec">Guilda em números</h2><div id="guilda"></div></section>
  </main>
  <footer class="foot"><img src="assets/game/app-icon.webp" alt=""><span>Guilda Brazucas · Eternal Hero (Rivvy Games). Fan site, sem vínculo oficial.</span></footer>
</div>
<script src="assets/js/core.js"></script>
<script src="assets/js/github.js"></script>
<script src="assets/js/guilda.js"></script>
<script>
(function(){
  const {M,leaders,climbers,fmt,fmtVal,fmtDelta,avatar,icon,esc} = BZ;
  document.getElementById('logoSlot').innerHTML = BZ.logoSVG(290);
  BZGUILD.load().then(G => { document.getElementById('guildStrip').innerHTML = BZGUILD.minis(G); });
  const sess = BZAUTH.session();
  if (sess) {
    document.getElementById('userName').innerHTML = icon('user', 16) + esc(sess.nome);
    const al = document.getElementById('adminLink');
    al.hidden = sess.perfil !== 'administrador';
    al.innerHTML = icon('lock', 16) + (BZGH.ready() ? 'Admin (conectado)' : 'Admin');
  }
  document.getElementById('logoutLink').addEventListener('click', e => { e.preventDefault(); BZAUTH.logout(); });
  // Ícones coloridos dos títulos da Home
  const SEC = {
    crown: '<defs><linearGradient id="sg-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".6" stop-color="#f5b400"/><stop offset="1" stop-color="#c47a00"/></linearGradient></defs>' +
      '<path d="M4 16.5 2.5 6.5l5.5 4.5L12 3.5l4 7.5 5.5-4.5-1.5 10z" fill="url(#sg-gold)" stroke="#5a3a00" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M4 16.5h16v3.5H4z" fill="#b3122e" stroke="#4a0410" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<circle cx="8" cy="13" r="1.4" fill="#3fbfff"/><circle cx="12" cy="12" r="1.6" fill="#e8273f"/><circle cx="16" cy="13" r="1.4" fill="#3fbfff"/>',
    trophy: '<defs><linearGradient id="sg-cup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".6" stop-color="#f5b400"/><stop offset="1" stop-color="#c47a00"/></linearGradient></defs>' +
      '<path d="M6.5 3h11v5.5a5.5 5.5 0 0 1-11 0z" fill="url(#sg-cup)" stroke="#5a3a00" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M6.5 5H3.5v2a3.5 3.5 0 0 0 3.5 3.5M17.5 5h3v2a3.5 3.5 0 0 1-3.5 3.5" fill="none" stroke="#f5b400" stroke-width="1.8" stroke-linecap="round"/>' +
      '<path d="M10.5 13.5h3V17h-3z" fill="#c47a00" stroke="#5a3a00" stroke-width="1.2"/>' +
      '<path d="M7.5 17h9l1 4h-11z" fill="#2a3140" stroke="#0b111b" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M9.5 6.5h5" stroke="#fff6c2" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>',
    trend: '<path d="M3 18.5h18v2H3z" fill="#34476a"/>' +
      '<path d="M3 15.5l6-6 4 4 7.5-7.5" fill="none" stroke="#0b111b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M3 15.5l6-6 4 4 7.5-7.5" fill="none" stroke="#7ee05a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M14.5 5.5H21V12z" fill="#7ee05a" stroke="#0b111b" stroke-width="1.4" stroke-linejoin="round"/>'
  };
  const secIcon = n => '<svg class="bz-ic sec-ic" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">' + SEC[n] + '</svg>';
  const cam = (nome, size) => BZ.canEdit() ? '<button type="button" class="cam" data-photo="' + esc(nome) + '" aria-label="Trocar foto de ' + esc(nome) + '">' + icon('camera', size || 18) + '</button>' : '';

  function renderHall(el, list){
    const t3 = leaders(list, 'poder', 3);
    const pod = [[t3[1], 2, 110, '#d6dde8'], [t3[0], 1, 150, '#ffc928'], [t3[2], 3, 80, '#ff9a5a']].filter(x => x[0]);
    let h = '<h2 class="sec">' + secIcon('crown') + 'Pódio de poder</h2><div class="podium">' + pod.map(([p, n, hh, c]) =>
      '<div class="pd" data-member="' + esc(p.nome) + '" style="--pc:' + c + '">' + avatar(p) + '<div class="n">' + esc(p.nome) + '</div><div class="bar" style="height:' + hh + 'px">' + n + 'º<small>' + fmtVal('poder', p.poder) + '</small></div></div>').join('') + '</div>';

    h += '<h2 class="sec">' + secIcon('trophy') + 'Campeões da semana <small>um por modalidade</small></h2><div class="champs">';
    M.forEach(m => {
      const top = leaders(list, m.k, 3), p = top[0];
      if (!p) { h += '<article class="hcard hcard-empty" data-k="' + m.k + '" style="--mc:var(--m-' + m.k + ')"><span class="tag">' + icon(m.icon, 16) + m.short + '</span><p class="empty">Sem dado nesta semana</p></article>'; return; }
      h += '<article class="hcard" data-k="' + m.k + '" style="--mc:var(--m-' + m.k + ')">' +
        '<span class="tag">' + icon(m.icon, 16) + m.short + '</span>' +
        '<div class="frame" data-member="' + esc(p.nome) + '"><div class="name"><span class="cls">' + icon(p.classe, 16) + '</span>' + esc(p.nome) + '</div>' +
        '<div class="shot">' + avatar(p) + cam(p.nome) + '</div>' +
        '<div class="val">' + fmtVal(m.k, p[m.k]) + '</div></div>' +
        '<ol class="runners">' + top.slice(1).map((r, i) => '<li data-member="' + esc(r.nome) + '"><span class="pos">' + (i + 2) + '</span>' + avatar(r, 'bz-av-xs') + '<span>' + esc(r.nome) + '</span><b>' + fmt(r[m.k]) + '</b></li>').join('') + '</ol></article>';
    });
    h += '</div>';

    const cl = M.map(m => ({ m, p: climbers(list, m.k)[0] })).filter(x => x.p && x.p.delta[x.m.k] > 0);
    h += '<h2 class="sec">' + secIcon('trend') + 'Os que mais subiram <small>maior evolução da semana em cada modalidade</small></h2><div class="climbs">';
    if (!cl.length) h += '<p class="empty">Esta é a primeira semana registrada. A partir da próxima semana publicada, aqui aparece quem mais evoluiu em cada modalidade.</p>';
    cl.forEach(({ m, p }) => {
      h += '<div class="climb" data-member="' + esc(p.nome) + '" style="--mc:var(--m-' + m.k + ')">' + avatar(p) + cam(p.nome, 14) +
        '<div><div class="k">' + icon(m.icon, 14) + m.short + '</div><div class="n">' + esc(p.nome) + '</div><div class="d">' + fmtDelta(m.k, p.delta[m.k]) + '</div></div></div>';
    });
    h += '</div>';
    el.innerHTML = h;
  }
  BZ.app({ renderHall });
})();
</script>
</body>
</html>
